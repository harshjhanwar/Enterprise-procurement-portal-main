@if (auth.isAuthenticated()) {
  <div class="shell">
    <header class="topbar">
      <a class="brand" routerLink="/dashboard">EPP</a>

      <nav class="nav" aria-label="Primary navigation">
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/plans" routerLinkActive="active">Procurement Plans</a>
        @if (auth.hasRole('Administrator')) {
          <a routerLink="/admin" routerLinkActive="active">Administration</a>
        }
      </nav>

      <div class="topbar-user">
        <div class="user-name">{{ auth.user().displayName }}</div>
        <div class="user-role">{{ auth.user().roles[0] }}</div>
      </div>

      <button mat-button type="button" (click)="auth.logout()">Sign out</button>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}
